name: Automated Unit and Guard Tests (CHATGPT-015)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-guards:
    name: Unit & Guard Validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar Unidades FPC / FGX (CHATGPT-002)
        run: python tests/ci_guard_fgx.py

      - name: Validar fronteiras runtime/design-time
        run: python tools/ci/validate_runtime_units.py

      - name: Validar Consistência de Ícones e Componentes (CHATGPT-004)
        run: python tests/ci_validate_icons.py

      - name: Validate pictogram generation and package icon loading
        run: |
          python pacote/generate_all_icons.py --check
          python -m unittest discover -s tests -p test_ci_validate_icons.py

      - name: Validar Inventário de Samples (CHATGPT-013)
        run: python tests/ci_validate_samples.py

      - name: Validar Scripts Python e Manifesto de Dependências
        run: |
          python -m py_compile installer/common/install_suite.py installer/common/check_runtime.py installer/common/create_runtime_ini.py tools/ci/validate_runtime_units.py
          python -c "import json, pathlib; json.loads(pathlib.Path('installer/dependencies.json').read_text(encoding='utf-8'))"

      - name: Install Lazarus and Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lazarus fpc

      - name: Install Lazarus and Free Pascal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install lazarus -y --no-progress

      - name: Compile and execute Pascal regression tests
        run: python tests/run_pascal_regressions.py
