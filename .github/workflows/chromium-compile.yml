name: Chromium compile (pinned CEF)

on:
  push:
    paths:
      - 'pacote/AI Input/AIChromiumBrowser/**'
      - 'pacote/samples/AI Input/chromium_capture_demo/**'
      - 'installer/dependencies.json'
      - 'tools/ci/compile_chromium.py'
      - '.github/workflows/chromium-compile.yml'
  pull_request:
    paths:
      - 'pacote/AI Input/AIChromiumBrowser/**'
      - 'pacote/samples/AI Input/chromium_capture_demo/**'
      - 'installer/dependencies.json'
      - 'tools/ci/compile_chromium.py'
      - '.github/workflows/chromium-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            pacote
            installer
            tools/ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FPC and Lazarus on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fpc lazarus libx11-dev libxcb1-dev
      - name: Install FPC and Lazarus on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          choco install lazarus --version=4.0.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Lazarus 4.0.0' }
          'C:\lazarus' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile Chromium component and demos
        run: python tools/ci/compile_chromium.py
      - name: Upload logs and executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-compile-${{ matrix.os }}
          path: build/chromium-compile/
          retention-days: 30
