name: MediaPipe Pose Bridge CI (CHATGPT-016)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bridge/mediapipe_pose/**'
      - '.github/workflows/mp_pose_bridge_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'bridge/mediapipe_pose/**'

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake (SIM Backend)
      shell: bash
      run: |
        mkdir -p bridge/mediapipe_pose/build/out
        cd bridge/mediapipe_pose/build/out
        cmake -DMP_POSE_BUILD=ON -DMP_BRIDGE_BACKEND=SIM ../..

    - name: Build Bridge Library (SIM Backend)
      shell: bash
      run: |
        cd bridge/mediapipe_pose/build/out
        cmake --build . --config Release

    - name: Compile C Smoke Test
      shell: bash
      run: |
        cd bridge/mediapipe_pose/tests
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cl.exe smoke_test.c /I../include /link /OUT:smoke_test.exe
        else
          gcc smoke_test.c -I../include -ldl -o smoke_test
        fi

    - name: Run Smoke Test
      shell: bash
      working-directory: bridge/mediapipe_pose/tests
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          find ../build/out -name "mp_pose_bridge.dll" -exec cp {} . \; 2>/dev/null || true
          ./smoke_test.exe
        else
          find ../build/out -name "libmp_pose_bridge.so" -exec cp {} . \; 2>/dev/null || true
          ./smoke_test
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mp-pose-bridge-${{ matrix.os }}
        path: |
          bridge/mediapipe_pose/build/out/bin/Release/mp_pose_bridge.dll
          bridge/mediapipe_pose/build/out/lib/libmp_pose_bridge.so
        if-no-files-found: ignore
