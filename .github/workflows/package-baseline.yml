name: Package and installer baseline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    name: Installer + all packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lazarus libssl3

      - name: Install Lazarus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install lazarus -y --no-progress

      - name: Validate manifest and compile every package
        shell: pwsh
        run: |
          python installer/common/install_suite.py ci --profile all

      - name: Validate installer scripts and manifests
        shell: pwsh
        run: |
          python -m py_compile installer/common/install_suite.py installer/common/check_runtime.py installer/common/create_runtime_ini.py
          python -c "import json, pathlib; json.loads(pathlib.Path('installer/dependencies.json').read_text(encoding='utf-8'))"

  package-inventory:
    name: Package inventory guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure every tracked LPK is declared
        run: |
          python installer/common/verify_manifest.py
      - name: Validate icon generation consistency (CHATGPT-003)
        run: |
          python pacote/generate_all_icons.py --check
      - name: Validate icon and component registrations (CHATGPT-004)
        run: |
          python tests/ci_validate_icons.py
