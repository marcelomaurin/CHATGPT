name: Samples Linux x64

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pacote/**'
      - 'installer/**'
      - 'install_components.sh'
      - 'tools/ci/**'
      - 'tests/**'
      - '.github/workflows/samples-linux-x64.yml'
  push:
    branches: [ main ]
    paths:
      - 'pacote/**'
      - 'installer/**'
      - 'install_components.sh'
      - 'tools/ci/**'
      - 'tests/**'
      - '.github/workflows/samples-linux-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lazarus and build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lazarus fpc fp-utils build-essential file xvfb zip unzip git libgl1-mesa-dev libglu1-mesa-dev libx11-dev
          lazbuild --version
          fpc -iV
          fpc -iTP
          fpc -iTO
          python3 --version

      - name: Register Lazarus bundled dependencies
        run: |
          set -euo pipefail
          IPRO="$(find /usr/lib/lazarus -type f \( -iname 'turbopoweripro.lpk' -o -iname '*ipro*.lpk' \) | head -1 || true)"
          if [[ -z "$IPRO" ]]; then
            echo "ERRO: TurboPowerIpro não encontrado na instalação Lazarus" >&2
            exit 1
          fi
          echo "TurboPowerIpro: $IPRO"
          lazbuild --add-package-link "$IPRO"

      - name: Validate repository boundaries and manifest
        run: |
          set -euo pipefail
          python3 -m json.tool installer/dependencies.json >/dev/null
          python3 tests/ci_guard_fgx.py
          python3 tools/ci/validate_runtime_units.py

      - name: Resolve dependencies and compile all CHATGPT packages
        env:
          CHATGPT_DEPS: ${{ runner.temp }}/chatgpt-dependencies
        run: |
          set -euo pipefail
          python3 installer/common/install_suite.py ci \
            --profile all \
            --lazbuild /usr/bin/lazbuild \
            --dependency-dir "$CHATGPT_DEPS"

      - name: Compile all samples for x86_64-linux
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x tools/ci/compile_samples_linux_x64.sh
          tools/ci/compile_samples_linux_x64.sh

      - name: Upload Linux x64 sample binaries and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHATGPT-samples-linux-x64
          path: .sample-build/linux-x64/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish report in job summary
        if: always()
        run: |
          if [[ -f .sample-build/linux-x64/REPORT.md ]]; then
            cat .sample-build/linux-x64/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when samples failed
        if: steps.compile.outcome != 'success'
        run: exit 1
