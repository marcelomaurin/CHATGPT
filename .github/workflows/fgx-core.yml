name: FGX Core (factual)

# Nucleo factual do AI Framework Graph Explorer.
# Nao depende de Lazarus, da LCL, nem de nenhum pacote openai_*.
# Compila so com FPC. Se este job ficar vermelho, o problema e o nucleo.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FGX_DIR: pacote/samples/AI Project/framework_graph_explorer

jobs:
  build-and-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fpc

      - name: Instalar Lazarus e Free Pascal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install lazarus -y --no-progress
          $lazarusBin = 'C:\lazarus'
          if (Test-Path $lazarusBin) {
            $lazarusBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $fpc = Get-ChildItem 'C:\lazarus\fpc' -Filter fpc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe não encontrado após instalar Lazarus' }
          $fpc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validar toolchain
        shell: bash
        run: |
          fpc -iV
          fpc -iTP
          fpc -iTO

      - name: Validar unidades puras FPC / FGX (CHATGPT-002)
        run: python tests/ci_guard_fgx.py

      - name: Validar fronteiras runtime/design-time
        run: python tools/ci/validate_runtime_units.py

      # -Sew: warning vira erro. Nada de "compila com avisos".
      - name: Compilar o nucleo
        shell: bash
        working-directory: ${{ env.FGX_DIR }}
        run: |
          mkdir -p build/units
          fpc -Mobjfpc -Sh -O2 -Sew -Fusrc -FUbuild/units -obuild/fgxcli src/fgxcli.lpr
          fpc -Mobjfpc -Sh -O2 -Sew -Fusrc -FUbuild/units -obuild/fgx_parser_tests src/fgx_parser_tests.lpr
          fpc -Mobjfpc -Sh -O2 -Sew -Fusrc -Fu"../../../../pacote/AI" -Fu"../../../../pacote/AI Graph" -FUbuild/units -obuild/fgx_graph_tests src/fgx_graph_tests.lpr

      - name: Testar parser Pascal factual
        shell: bash
        working-directory: ${{ env.FGX_DIR }}
        run: ./build/fgx_parser_tests fixtures/parser/parser_fixture.pas

      - name: Testar grafo factual
        shell: bash
        working-directory: ${{ env.FGX_DIR }}
        run: ./build/fgx_graph_tests ../../../..

      - name: Rodar contra a fixture
        shell: bash
        working-directory: ${{ env.FGX_DIR }}
        run: ./build/fgxcli fixtures/repo build/out

      - name: Rodar contra o repositorio real (E1)
        shell: bash
        working-directory: ${{ env.FGX_DIR }}
        run: ./build/fgxcli ../../../.. build/out-real

      - name: Publicar o grafo factual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fgx-graph-${{ matrix.os }}
          path: ${{ env.FGX_DIR }}/build/out-real/
